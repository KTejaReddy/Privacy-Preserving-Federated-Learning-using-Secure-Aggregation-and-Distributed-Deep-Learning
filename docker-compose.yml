# ---------------------------------------------------------------------------
# Federated AI Platform — full stack
#   docker compose up --build
#   -> Web UI  : http://localhost:8080
#   -> API docs: http://localhost:8080/docs
# ---------------------------------------------------------------------------
version: "3.9"

services:
  # ------------------------------------------------------------ data stores
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: federated
      POSTGRES_PASSWORD: federated
      POSTGRES_DB: federated_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U federated"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------ backend
  api:
    build:
      context: ./backend
    environment:
      ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://federated:federated@postgres:5432/federated_ai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ENABLE_HEAVY_DEPS: ${ENABLE_HEAVY_DEPS:-false}
      FL_USE_CELERY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg2://federated:federated@postgres:5432/federated_ai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-string}
      FL_USE_CELERY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------------ frontend + edge
  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
